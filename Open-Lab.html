<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Robotics Virtual Lab - Quick Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2563eb, #0d9488);
      border-radius: 14px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
    }
    p {
      margin: 0 0 24px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
    .tip {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h1>Open Robotics Virtual Lab</h1>
    <p>Click below to open the local 3D robotics simulation laboratory in your browser.</p>
    <a href="http://localhost:5173" class="btn" target="_blank">Open Simulator (http://localhost:5173)</a>
    <div class="tip">
      Note: Make sure to double-click <strong>Launch-Lab.bat</strong> first to start the local simulation engine!
    </div>
  </div>
</body>
</html>
